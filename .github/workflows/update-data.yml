name: Update Orbis market data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance curl_cffi pandas numpy

      - name: Run data update
        run: python generate_correlation.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/correlation.json data/price_history.csv
          git diff --staged --quiet || git commit -m "Update market data ($(date -u +'%Y-%m-%d'))"
          git push