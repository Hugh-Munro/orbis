<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbis</title>
<link rel="icon" type="image/png" href="public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Serif:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="src/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webcola@3.4.0/WebCola/cola.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-cola@2.5.1/cytoscape-cola.min.js"></script>
</head>
<body>

<div id="view-dots">
  <button class="view-dot active" id="dot-network" title="Portfolio Network"></button>
  <button class="view-dot" id="dot-chart" title="Time Series"></button>
</div>

<div id="stage">
  <div id="app">

    <div id="sidebar">
      <div id="sidebar-header">
        <h1>Orbis</h1>
        <p>The Portfolio Network</p>
      </div>
      <div id="search-wrap">
        <div style="position:relative">
          <i class="ti ti-search" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;color:#a0a8b0;pointer-events:none"></i>
          <input id="search-input" type="search" placeholder="Search assets…" autocomplete="off" style="padding-left:30px">
        </div>
      </div>
      <div id="universe-panel">
        <p id="universe-header">
          Investable Universe
          <i class="ti ti-chevron-down universe-chevron"></i>
        </p>
        <div id="universe-list"></div>
      </div>
      <div id="weighting-panel">
        <p>Allocation Method</p>
        <div class="weight-tabs">
          <div id="weight-tab-indicator"></div>
          <button class="wt-tab active" data-scheme="equal" type="button">Equal Weight</button>
          <button class="wt-tab" data-scheme="inverse-vol" type="button">Vol Parity</button>
          <button class="wt-tab" data-scheme="custom" type="button">Custom</button>
          <button class="wt-tab" data-scheme="saved" type="button">Saved</button>
        </div>
        <div id="custom-weights-wrap"></div>
        <div id="saved-portfolios-wrap"></div>
      </div>
      <div id="portfolio-value-panel">
        <p>NAV</p>
        <div class="pv-input-wrap">
          <span class="pv-prefix">$</span>
          <input id="portfolio-value-input" type="text" inputmode="numeric" value="100,000" autocomplete="off">
        </div>
      </div>
    </div>

    <div id="cy-wrap">
      <div id="cy"></div>
      <div id="canvas-legend">
        <div id="legend-items"></div>
        <button id="reset-btn" type="button" title="Reset graph">
          <i class="ti ti-refresh"></i>
        </button>
      </div>
      <div class="floating-card" id="fc">
        <div class="fc-header">
          <div class="fc-name" id="fc-name"></div>
          <div class="fc-pill" id="fc-pill"></div>
        </div>
        <div class="fc-ticker" id="fc-ticker"></div>
        <div class="fc-allocation" id="fc-allocation"></div>
        <div class="fc-mini-grid" id="fc-mini-grid"></div>
        <div class="fc-corr-section" id="fc-corr-section"></div>
      </div>
      <div class="floating-card" id="fc-edge">
        <div class="fc-header">
          <div class="fc-name" id="fc-edge-name"></div>
        </div>
        <div class="fc-edge-value" id="fc-edge-value"></div>
        <div class="fc-edge-stats" id="fc-edge-stats"></div>
      </div>
    </div>

    <div id="sidebar-right">
      <div id="stats-panel">
        <div id="stats-panel-body"></div>
      </div>
    </div>

  </div>

  <div id="chart-view">
    <div id="chart-header">
      <button id="chart-back-btn" type="button">
        <i class="ti ti-arrow-left"></i>
      </button>
      <div id="chart-title-wrap">
        <div id="chart-title">Realised Volatility (30D)</div>
      </div>
    </div>
    <div id="chart-tabs">
      <div id="chart-tab-indicator"></div>
      <button class="chart-tab active" data-chart="vol">Realised Vol</button>
      <button class="chart-tab" data-chart="corr">Correlation</button>
      <button class="chart-tab" data-chart="concentration">Concentration</button>
      <button class="chart-tab" data-chart="returns">Returns</button>
      <button class="chart-tab" data-chart="drawdown">Drawdown</button>
      <button class="chart-tab" data-chart="sharpe">Risk-Adj.</button>
    </div>
    <div id="chart-toggles"></div>
    <div id="drawdown-threshold-wrap" class="chart-control-row">
      <label class="chart-switch" style="--switch-accent:#c0385a">
        <input type="checkbox" id="dd-threshold-toggle">
        <span class="chart-switch-track"><span class="chart-switch-thumb"></span></span>
      </label>
      <span class="chart-switch-label">Highlight drawdowns beyond</span>
      <span id="dd-threshold-controls">
        <input type="range" id="dd-threshold-slider" min="5" max="80" step="1" value="20">
        <span id="dd-threshold-value">-20%</span>
      </span>
    </div>
    <div id="vol-sigma-wrap" class="chart-control-row">
      <label class="chart-switch" style="--switch-accent:#c96a1f">
        <input type="checkbox" id="vol-sigma-toggle">
        <span class="chart-switch-track"><span class="chart-switch-thumb"></span></span>
      </label>
      <span class="chart-switch-label">Highlight 2σ vol spikes</span>
    </div>
    <div id="corr-window-wrap" class="chart-control-row">
      <span class="chart-switch-label">Correlation window</span>
      <div class="corr-window-toggle">
        <button type="button" class="corr-window-btn active" data-window="full">Full sample</button>
        <button type="button" class="corr-window-btn" data-window="90d">90D rolling</button>
      </div>
    </div>
    <div id="ratio-toggle-wrap" class="chart-control-row">
      <div class="corr-window-toggle">
        <button type="button" class="ratio-btn active" data-ratio="sharpe">Sharpe</button>
        <button type="button" class="ratio-btn" data-ratio="sortino">Sortino</button>
        <button type="button" class="ratio-btn" data-ratio="calmar">Calmar</button>
        <button type="button" class="ratio-btn" data-ratio="ir">Info Ratio</button>
      </div>
    </div>
    <div id="chart-area">
      <svg id="chart-svg"></svg>
      <div id="chart-tooltip"></div>
    </div>
  </div>
</div>

<script src="src/main.js" type="module"></script>
</body>
</html>
